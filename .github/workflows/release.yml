name: Release

# Bump CFBundleShortVersionString in App/Info.plist and push to main. If no tag
# matches the version yet, this tests, builds, packages a DMG with a checksum,
# tags the commit and publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          VERSION=$(grep -A1 CFBundleShortVersionString App/Info.plist | tail -1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1 && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Test
        run: swift test
      - name: Build and package
        run: scripts/package-dmg.sh
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: Shut ${{ needs.decide.outputs.version }}
          generate_release_notes: true
          files: |
            build/releases/*.dmg
            build/releases/*.sha256
